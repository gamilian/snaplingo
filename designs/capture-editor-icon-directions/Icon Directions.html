<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapLingo 截图编辑器图标方向</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9e5de;
      --paper: #f8f6f1;
      --paper-strong: #fffdfa;
      --ink: #302d29;
      --muted: #77716a;
      --line: #d8d1c8;
      --accent: #c96747;
      --accent-soft: #f2dfd5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 980px;
      background: var(--canvas);
      color: var(--ink);
      font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    main {
      width: 980px;
      margin: 0 auto;
      padding: 52px 0 72px;
    }

    header { margin: 0 0 36px; }
    h1 { margin: 0 0 9px; font-size: 28px; letter-spacing: -0.035em; font-weight: 660; }
    header p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }

    .directions { display: grid; gap: 28px; }

    .direction {
      padding: 26px;
      border: 1px solid rgba(75, 66, 58, 0.12);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 16px 42px rgba(69, 57, 45, 0.08);
    }

    .direction-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .direction-title { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
    h2 { margin: 0; font-size: 18px; letter-spacing: -0.02em; font-weight: 650; }
    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #8e472f;
      font-size: 11px;
      font-weight: 650;
    }
    .direction-head p { max-width: 650px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .spec { color: #918a82; font-size: 11px; white-space: nowrap; }

    .toolbar-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 86px;
      margin-bottom: 22px;
      border: 1px solid rgba(75, 66, 58, 0.08);
      border-radius: 13px;
      background: #ddd8d0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 700px;
      height: 42px;
      padding: 6px;
      border: 1px solid rgba(79, 70, 60, 0.1);
      border-radius: 12px;
      background: rgba(255, 253, 250, 0.97);
      box-shadow: 0 10px 26px rgba(59, 48, 39, 0.16);
    }

    .tool {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 29px;
      height: 29px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #5d5954;
      cursor: pointer;
      transition: color 130ms ease, background 130ms ease, border-color 130ms ease, transform 130ms ease;
    }

    .tool:hover { color: var(--ink); background: #efebe5; transform: translateY(-1px); }
    .tool.is-active { color: #87452f; border-color: #e4bda9; background: #f6e7df; }
    .tool.group { width: 36px; gap: 0; }
    .tool.primary { color: #fffaf5; border-color: var(--accent); background: var(--accent); }
    .tool.primary:hover { color: white; background: #b95a3d; }
    .divider { width: 1px; height: 19px; margin: 0 2px; background: #dfd9d1; }
    .toolbar-spacer { flex: 1; }

    .icon {
      width: 18px;
      height: 18px;
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .chevron { width: 8px; height: 8px; margin-left: -2px; }
    .fill { fill: currentColor; stroke: none; }
    .soft-fill { fill: currentColor; stroke: none; opacity: 0.18; }
    .set-a .icon { stroke-width: 1.65; }
    .set-b .icon { stroke-width: 1.9; }
    .set-c .icon { stroke-width: 1.5; }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
    }

    .icon-cell {
      display: grid;
      place-items: center;
      gap: 7px;
      min-height: 66px;
      padding: 9px 4px 7px;
      border: 1px solid rgba(75, 66, 58, 0.08);
      border-radius: 10px;
      background: var(--paper-strong);
      color: #4d4944;
    }
    .icon-cell .icon { width: 20px; height: 20px; }
    .icon-cell span { color: #8b847d; font-size: 10px; }

    footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>

  <main>
    <header>
      <h1>截图编辑器 · 图标方向</h1>
      <p>三套方案均按当前 700×42 px 工具栏和 18 px 图标尺寸绘制。优先保证一眼看懂，再区分线条气质；点击任一工具可查看选中状态。</p>
    </header>
    <section id="directions" class="directions" aria-label="图标设计方向"></section>
    <footer>形状组固定同时呈现矩形与椭圆；马赛克固定使用规则棋盘像素格。两种关键语义在所有方向中保持一致。</footer>
  </main>

  <script>
    const iconNames = [
      ['pointer', '选择'], ['shape', '形状组'], ['rectangle', '矩形'], ['ellipse', '椭圆'],
      ['arrow', '箭头'],
      ['line', '直线'], ['pen', '铅笔'], ['text', '文字'], ['mosaic', '马赛克'],
      ['eraser', '橡皮擦'], ['undo', '撤销'], ['redo', '重做'], ['pin', '贴图'],
      ['save', '保存'], ['copy', '复制'], ['chevron', '展开']
    ];

    const directions = [
      {
        id: 'a',
        title: 'A · Snipaste Direct',
        badge: '推荐',
        description: '采用 Snipaste 已验证的直接隐喻，再收敛为更安静的线性语言。矩形与椭圆明确重叠，马赛克就是棋盘像素块。',
        spec: '1.65 px · 轻量'
      },
      {
        id: 'b',
        title: 'B · Claude Soft',
        description: '保留同样直接的功能语义，用更圆润的轮廓和轻柔底色增加 Claude 式亲和感，小尺寸下存在感最强。',
        spec: '1.9 px · 柔和'
      },
      {
        id: 'c',
        title: 'C · Compact Ink',
        description: '矩形、椭圆和像素格保持完整，用更锐利的转角与克制端点形成编辑器气质，艺术感最强但不牺牲辨识度。',
        spec: '1.5 px · 个性'
      }
    ];

    const useIcon = (set, name, extra = '') =>
      `<svg class="icon ${extra}" aria-hidden="true"><use href="#${set}-${name}"></use></svg>`;

    const tool = (set, name, label, options = {}) => {
      const classes = ['tool', options.group ? 'group' : '', options.primary ? 'primary' : '', options.active ? 'is-active' : ''].filter(Boolean).join(' ');
      const chevron = options.group ? useIcon(set, 'chevron', 'chevron') : '';
      return `<button class="${classes}" type="button" data-tool="${name}" title="${label}" aria-label="${label}">${useIcon(set, name)}${chevron}</button>`;
    };

    const renderToolbar = (set) => `
      <div class="toolbar" role="toolbar" aria-label="${set.toUpperCase()} 方案工具栏">
        ${tool(set, 'pointer', '选择与移动', { active: true })}
        ${tool(set, 'shape', '矩形与椭圆', { group: true })}
        ${tool(set, 'arrow', '箭头与直线', { group: true })}
        ${tool(set, 'pen', '铅笔')}
        ${tool(set, 'text', '文字')}
        ${tool(set, 'mosaic', '马赛克')}
        ${tool(set, 'eraser', '橡皮擦')}
        <span class="divider"></span>
        ${tool(set, 'undo', '撤销')}
        ${tool(set, 'redo', '重做')}
        <span class="toolbar-spacer"></span>
        ${tool(set, 'pin', '贴图')}
        ${tool(set, 'save', '保存')}
        ${tool(set, 'copy', '复制', { primary: true })}
      </div>`;

    const renderDirection = (direction) => `
      <article class="direction set-${direction.id}" data-direction="${direction.id}">
        <div class="direction-head">
          <div>
            <div class="direction-title"><h2>${direction.title}</h2>${direction.badge ? `<span class="badge">${direction.badge}</span>` : ''}</div>
            <p>${direction.description}</p>
          </div>
          <span class="spec">${direction.spec}</span>
        </div>
        <div class="toolbar-stage">${renderToolbar(direction.id)}</div>
        <div class="icon-grid">
          ${iconNames.map(([name, label]) => `<div class="icon-cell">${useIcon(direction.id, name)}<span>${label}</span></div>`).join('')}
        </div>
      </article>`;

    const directionsRoot = document.querySelector('#directions');
    directionsRoot.innerHTML = directions.map(renderDirection).join('');
    directionsRoot.addEventListener('click', (event) => {
      const button = event.target.closest('.tool');
      if (!button || button.classList.contains('primary')) return;
      const toolbar = button.closest('.toolbar');
      toolbar.querySelectorAll('.tool').forEach((item) => item.classList.remove('is-active'));
      button.classList.add('is-active');
    });
  </script>
</body>
</html>
