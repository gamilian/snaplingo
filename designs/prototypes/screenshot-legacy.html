<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot - SnapLingo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
      position: relative;
      background: transparent;
    }

    #screenshot-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      pointer-events: none;
      opacity: 0;
    }

    #selection-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
    }

    body.ready #screenshot-background,
    body.ready #selection-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    #selection-rect {
      position: absolute;
      border: 2px solid #0066ff;
      background: rgba(0, 102, 255, 0.1);
      display: none;
      pointer-events: none;
    }

    #size-label {
      position: absolute;
      background: #0066ff;
      color: white;
      padding: 4px 8px;
      font-size: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      border-radius: 4px;
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <img id="screenshot-background" />
  <div id="selection-overlay"></div>
  <div id="selection-rect"></div>
  <div id="size-label"></div>

  <script type="module">
    const { invoke } = window.__TAURI__.core;
    const { emitTo, listen } = window.__TAURI__.event;

    let screenshotData = null;
    let scaleFactor = 1.0;
    let isSelecting = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;

    const backgroundImg = document.getElementById('screenshot-background');
    const selectionRect = document.getElementById('selection-rect');
    const sizeLabel = document.getElementById('size-label');

    await listen('screenshot-data', (event) => {
      screenshotData = event.payload.base64;
      scaleFactor = event.payload.scale_factor || 1.0;
      backgroundImg.src = `data:image/png;base64,${screenshotData}`;
      document.body.classList.add('ready');
    });
    await invoke('screenshot_overlay_ready');

    document.addEventListener('mousedown', (e) => {
      isSelecting = true;
      startX = e.clientX;
      startY = e.clientY;
      currentX = e.clientX;
      currentY = e.clientY;

      selectionRect.style.display = 'block';
      sizeLabel.style.display = 'block';
      updateSelection();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isSelecting) return;

      currentX = e.clientX;
      currentY = e.clientY;
      updateSelection();
    });

    document.addEventListener('mouseup', async () => {
      if (!isSelecting) return;
      isSelecting = false;

      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);

      if (width < 10 || height < 10) {
        await invoke('close_screenshot_window');
        return;
      }

      try {
        const croppedBase64 = await invoke('crop_screenshot', { x, y, width, height });
        await emitTo('main', 'screenshot-captured', croppedBase64);
        await invoke('close_screenshot_window');
      } catch (error) {
        console.error('Failed to crop screenshot:', error);
        alert(`截图裁剪失败: ${error}`);
        await invoke('close_screenshot_window');
      }
    });

    document.addEventListener('keydown', async (e) => {
      if (e.key === 'Escape') {
        await invoke('close_screenshot_window');
      }
    });

    function updateSelection() {
      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);

      selectionRect.style.left = x + 'px';
      selectionRect.style.top = y + 'px';
      selectionRect.style.width = width + 'px';
      selectionRect.style.height = height + 'px';

      const physicalWidth = Math.round(width * scaleFactor);
      const physicalHeight = Math.round(height * scaleFactor);
      sizeLabel.textContent = `${physicalWidth} × ${physicalHeight}`;
      sizeLabel.style.left = x + 'px';
      sizeLabel.style.top = (y + height + 8) + 'px';
    }
  </script>
</body>
</html>
