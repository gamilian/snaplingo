<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapLingo - 玻璃拟态风格</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px;
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      height: calc(100vh - 80px);
    }

    /* 玻璃效果基础 */
    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    /* 侧边栏 */
    .sidebar {
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .logo-text {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      font-weight: 500;
      position: relative;
      overflow: hidden;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.1);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .nav-item:hover::before {
      opacity: 1;
    }

    .nav-item.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      background: #fff;
      border-radius: 0 2px 2px 0;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      opacity: 0.9;
    }

    .nav-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 12px 0;
    }

    /* 主内容区 */
    .main {
      padding: 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .auto-save {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      backdrop-filter: blur(10px);
    }

    .auto-save::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      width: fit-content;
    }

    .tab {
      padding: 8px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: rgba(255, 255, 255, 0.7);
      border: none;
      background: transparent;
    }

    .tab.active {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    /* 卡片 */
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .card-body {
      padding: 24px;
    }

    .setting-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 24px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-label {
      font-size: 15px;
      font-weight: 500;
    }

    /* 输入控件 - 玻璃风格 */
    select, input[type="number"] {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      min-width: 180px;
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.2s;
    }

    select:hover, input[type="number"]:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
    }

    option {
      background: #667eea;
      color: #fff;
    }

    /* 开关 */
    .toggle {
      width: 48px;
      height: 28px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .toggle.active {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.5);
    }

    .toggle::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .toggle.active::after {
      left: 22px;
      background: #667eea;
    }

    /* 按钮 */
    .btn {
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: rgba(255, 255, 255, 0.9);
      color: #667eea;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.3);
    }

    .btn-primary:hover {
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
    }

    /* 快捷键显示 */
    .hotkey {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'SF Mono', monospace;
      backdrop-filter: blur(10px);
    }

    .hotkey-key {
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 侧边栏 -->
    <aside class="sidebar glass">
      <div class="logo">
        <div class="logo-icon">S</div>
        <div class="logo-text">SnapLingo</div>
      </div>

      <div class="nav-item active">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span>通用</span>
      </div>

      <div class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <span>截图</span>
      </div>

      <div class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
        </svg>
        <span>翻译</span>
      </div>

      <div class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <span>OCR</span>
      </div>

      <div class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path>
        </svg>
        <span>服务</span>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
        </svg>
        <span>收藏夹</span>
      </div>

      <div class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>历史记录</span>
      </div>
    </aside>

    <!-- 主内容 -->
    <main class="main glass">
      <div class="header">
        <h1>通用</h1>
        <div class="auto-save">自动保存</div>
      </div>

      <div class="tabs">
        <button class="tab active">界面与启动</button>
        <button class="tab">系统权限</button>
        <button class="tab">网络</button>
        <button class="tab">实验性功能</button>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">界面</div>
        </div>
        <div class="card-body">
          <div class="setting-row">
            <div class="setting-label">界面语言</div>
            <select>
              <option>中文简体</option>
              <option>English</option>
              <option>日本語</option>
            </select>
          </div>

          <div class="setting-row">
            <div class="setting-label">主题</div>
            <select>
              <option>跟随系统</option>
              <option>浅色</option>
              <option>深色</option>
            </select>
          </div>

          <div class="setting-row">
            <div class="setting-label">开机自启</div>
            <div class="toggle active"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">快捷键</div>
        </div>
        <div class="card-body">
          <div class="setting-row">
            <div class="setting-label">划词翻译</div>
            <div class="hotkey">
              <span class="hotkey-key">⌘</span>
              <span class="hotkey-key">⇧</span>
              <span class="hotkey-key">D</span>
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-label">截图翻译</div>
            <div class="hotkey">
              <span class="hotkey-key">⌘</span>
              <span class="hotkey-key">⇧</span>
              <span class="hotkey-key">S</span>
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-label">显示翻译窗口</div>
            <div class="hotkey">
              <span class="hotkey-key">⌘</span>
              <span class="hotkey-key">⇧</span>
              <span class="hotkey-key">A</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
