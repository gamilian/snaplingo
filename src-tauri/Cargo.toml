[package]
name = "snaplingo"
version = "0.1.0"
description = "A cross-platform screenshot, OCR, and translation tool"
authors = ["SnapLingo Contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "snaplingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-screenshots = { git = "https://github.com/ayangweb/tauri-plugin-screenshots" }
log = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async traits
async-trait = "0.1"

# Image processing
image = "0.25"
ab_glyph = "0.2"

# Clipboard and keyboard
arboard = "3.2"
enigo = "0.1"

# HTTP client for providers
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
md5 = "0.7"

# Language detection
lingua = "1.5"

# OCR
tesseract = "0.14"
base64 = "0.21"

# Configuration
dirs = "5.0"
json-patch = "1.2"

# Database and secrets
rusqlite = { version = "0.29", features = ["bundled"] }
keyring = "2.0"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
parking_lot = { version = "0.12.5", features = ["send_guard"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSCursor", "NSEvent", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSGeometry", "objc2-core-foundation"] }
xcap = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.51", features = ["Win32_UI_Input_KeyboardAndMouse"] }
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
xcap = "0.9"

[dev-dependencies]
tempfile = "3.8"
mockito = "1.2"
