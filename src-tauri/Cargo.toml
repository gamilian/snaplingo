[package]
name = "snaplingo"
version = "0.1.0"
description = "A cross-platform screenshot, OCR, and translation tool"
authors = ["SnapLingo Contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "snaplingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
log = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async traits
async-trait = "0.1"

# Image processing
image = "0.24"

# Clipboard and keyboard
arboard = "3.2"
enigo = "0.1"

# HTTP client for providers
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"

# Language detection
lingua = "1.5"

# Configuration
dirs = "5.0"
json-patch = "1.2"

# Database and secrets
rusqlite = { version = "0.29", features = ["bundled"] }
keyring = "2.0"

# Global hotkeys
global-hotkey = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.51", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
xcb = "1.2"

[dev-dependencies]
tempfile = "3.8"
mockito = "1.2"
