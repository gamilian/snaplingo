<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapLingo</title>
    <script>
      if (new URLSearchParams(window.location.search).get('window') === 'capture') {
        document.documentElement.setAttribute('data-window', 'capture');
      }
    </script>
    <style>
      html[data-window="capture"],
      html[data-window="capture"] body,
      html[data-window="capture"] #root {
        background: transparent;
      }

      html[data-window="capture"] body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
