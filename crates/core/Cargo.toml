[package]
name = "snaplingo-core"
version = "0.1.23"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Portable SnapLingo domain types, workflows and adapter contracts"

[features]
tesseract-ocr = []
test-support = []

[dependencies]
snaplingo-assets = { path = "../assets" }
serde_json = "1.0"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
anyhow = "1.0"
async-trait = "0.1"
image = "0.25"
webp = "0.3"
ab_glyph = "0.2"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
md5 = "0.7"
semver = "1"
lingua = "1.5"
base64 = "0.21"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = { version = "0.12.5", features = ["send_guard"] }

[dev-dependencies]
reqwest = { version = "0.11", features = ["json", "socks"] }
rusqlite = { version = "0.29", features = ["bundled"] }
tempfile = "3.8"
mockito = "1.2"
