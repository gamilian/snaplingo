[package]
name = "snaplingo-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable views, input, drawing and optional CPU rendering and accessibility"

[features]
default = []
rendering = ["dep:snaplingo-assets", "dep:tiny-skia", "dep:cosmic-text"]
accessibility = ["dep:accesskit"]

[dependencies]
unicode-segmentation = "1.12"
snaplingo-assets = { path = "../assets", optional = true }
tiny-skia = { version = "0.11.4", optional = true }
cosmic-text = { version = "0.14.2", optional = true }
accesskit = { version = "0.25.2", optional = true }

[dev-dependencies]
serde_json.workspace = true
syn = { workspace = true, default-features = false, features = ["full", "parsing", "visit"] }

