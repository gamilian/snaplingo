[package]
name = "snaplingo-settings"
version = "0.1.23"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Portable Settings sessions, ordered workflows and UI projections"

[dependencies]
snaplingo-core = { path = "../core" }
snaplingo-ui = { path = "../ui" }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
image = "0.25"

[dev-dependencies]
async-trait = "0.1"
anyhow = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
serde_json = "1.0"
snaplingo-storage = { path = "../storage", features = ["test-support"] }

tempfile = "3.8"
