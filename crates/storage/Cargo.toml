[package]
name = "snaplingo-storage"
version = "0.1.23"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[features]
test-support = []

[lib]
path = "lib.rs"

[dependencies]
snaplingo-core = { path = "../core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
md5 = "0.7"
rusqlite = { version = "0.29", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
