[package]
name = "snaplingo"
version = "0.1.23"
description = "A cross-platform screenshot, OCR, and translation tool"
authors = ["SnapLingo Contributors"]
license = "MIT"
repository = "https://github.com/gamilian/snaplingo"
edition = "2021"
rust-version = "1.88"
default-run = "snaplingo"

[lib]
path = "lib.rs"
name = "snaplingo_lib"
crate-type = ["rlib"]

[features]
default = ["native-app"]
native-app = ["dep:snaplingo-desktop", "dep:winit", "dep:softbuffer", "dep:accesskit_winit", "dep:embed-resource"]
tesseract-ocr = ["dep:tesseract", "snaplingo-core/tesseract-ocr"]

[build-dependencies]
embed-resource = { version = "3.0.9", optional = true }

[dependencies]
snaplingo-ui = { path = "../ui" }
snaplingo-assets = { path = "../assets" }
snaplingo-render = { path = "../render" }
snaplingo-accessibility = { path = "../accessibility" }
snaplingo-settings = { path = "../settings" }
accesskit = "0.25.2"
snaplingo-core = { path = "../core" }
snaplingo-storage = { path = "../storage" }
serde_json = "1.0"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
tray-icon = { version = "0.23", default-features = false }
fern = "0.7"
open = { version = "5.3.5", features = ["shellexecute-on-windows"] }
getrandom = { version = "0.3", features = ["std"] }
global-hotkey = "0.8"
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
auto-launch = "0.5"
log = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async traits
async-trait = "0.1"

# Image processing
image = "0.25"
webp = "0.3"
ab_glyph = "0.2"
fontdb = "0.23"

# Clipboard and keyboard
arboard = "3.2"
enigo = "0.1"

# HTTP client for providers
reqwest = { version = "0.11", features = ["json", "socks"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
md5 = "0.7"
sha2 = "0.10"
semver = "1"
tempfile = "3.8"

# Language detection
lingua = "1.5"

# OCR
base64 = "0.21"
oar-ocr-core = { version = "=0.6.0", default-features = false }
# The 0.6.3 macro release changed the 0.6.0 core's validation syntax.
oar-ocr-derive = "=0.6.0"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray = "0.17"

# Configuration
dirs = "5.0"
json-patch = "1.2"

# Database and credentials
rusqlite = { version = "0.29", features = ["bundled"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
parking_lot = { version = "0.12.5", features = ["send_guard"] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.27.2"
dispatch2 = "0.3.1"
block2 = "0.6.2"
ocr-rs = { git = "https://github.com/zibo-chen/ocr-rs", rev = "664a945953e46186b37203fa4902a20d60a32809", default-features = false }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["coreml"] }
accessibility-sys = "0.2"
core-foundation = "0.9"
core-graphics = "0.23"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSAppearance", "NSAttributedString", "NSAffineTransform", "NSBezierPath", "NSBitmapImageRep", "NSBox", "NSButton", "NSColor", "NSColorPanel", "NSColorSpace", "NSColorWell", "NSControl", "NSCursor", "NSEvent", "NSFont", "NSFontManager", "NSGraphics", "NSGraphicsContext", "objc2-core-foundation", "NSImage", "NSImageView", "NSMenu", "NSMenuItem", "NSPanel", "NSParagraphStyle", "NSPopUpButton", "NSPasteboard", "NSPrintInfo", "NSPrintOperation", "NSRunningApplication", "NSScreen", "NSShadow", "NSSlider", "NSScroller", "NSScrollView", "NSTableView", "NSTableColumn", "NSTableHeaderView", "NSTableCellView", "NSText", "NSTextField", "NSTextInputClient", "NSTextInputContext", "NSTextStorage", "NSTextView", "NSTextContainer", "NSLayoutManager", "NSTrackingArea", "NSView", "NSUserInterfaceItemIdentification", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSRegularExpression", "NSTextCheckingResult", "NSUserDefaults", "NSNotification", "NSGeometry", "NSProcessInfo", "objc2-core-foundation"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation"] }
xcap = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
snaplingo-desktop = { path = "../desktop", optional = true }
winit = { version = "0.30.12", optional = true }
softbuffer = { version = "0.4.8", optional = true }
accesskit_winit = { version = "0.34.2", default-features = false, features = ["rwh_06"], optional = true }
libloading = "0.9"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["directml"] }
clipboard-win = "5.4.1"
windows = { version = "0.51", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_IO",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies.tesseract]
version = "0.14"
optional = true

[target.'cfg(target_os = "linux")'.dependencies]
tesseract = "0.14"
xcap = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
snaplingo-core = { path = "../core", features = ["test-support"] }
snaplingo-storage = { path = "../storage", features = ["test-support"] }
mockito = "1.2"
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }

[[bin]]
name = "snaplingo"
path = "main.rs"
required-features = ["native-app"]

[[bin]]
name = "snaplingo-native"
path = "native_main.rs"
required-features = ["native-app"]

[[test]]
name = "native_app_smoke"
harness = false
required-features = ["native-app"]

[[test]]
name = "scrolling_overlays_native"
harness = false

[[test]]
name = "scrolling_controls_native"
harness = false

[[test]]
name = "pinned_window_native"
harness = false

[[test]]
name = "native_ui_workflows"
harness = false
required-features = ["native-app"]

[[test]]
name = "ui_thread_native"
harness = false

[[test]]
name = "selected_text_native"
harness = false

[[test]]
name = "settings_general_native"
harness = false

[[test]]
name = "settings_features_native"
harness = false

[[test]]
name = "settings_hotkeys_native"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKWebView", "WKWebViewConfiguration", "WKNavigation", "WKSnapshotConfiguration", "objc2-app-kit", "objc2-core-foundation"] }
