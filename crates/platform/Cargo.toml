[package]
name = "snaplingo-platform"
version = "0.1.23"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Native system capability adapters for SnapLingo Core"

[features]
test-support = []
tesseract-ocr = ["dep:tesseract", "snaplingo-core/tesseract-ocr"]

[dependencies]
snaplingo-core = { path = "../core" }
ab_glyph = "0.2"
arboard = "3.2"
async-trait = "0.1"
auto-launch = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
enigo = "0.1"
fontdb = "0.23"
getrandom = { version = "0.3", features = ["std"] }
global-hotkey = "0.8"
image = "0.25"
log = "0.4"
parking_lot = { version = "0.12.5", features = ["send_guard"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
accessibility-sys = "0.2"
core-foundation = "0.9"
core-graphics = "0.23"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSAlert", "NSButton", "NSColor", "NSColorPanel", "NSColorSpace", "NSColorWell", "NSControl", "NSPanel", "NSCursor", "NSEvent", "NSImage", "NSPasteboard", "NSResponder", "NSText", "NSTextView", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSGeometry", "NSObject", "NSRange", "NSString", "objc2-core-foundation"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation"] }
xcap = "0.9"
tesseract = { version = "0.14", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }
clipboard-win = "5.4.1"
windows = { version = "0.51", features = ["Foundation", "Foundation_Collections", "Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_DataExchange", "Win32_System_Com", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
tesseract = "0.14"
xcap = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"

[[test]]
name = "single_instance_native"
harness = false
