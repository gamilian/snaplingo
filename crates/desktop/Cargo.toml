[package]
name = "snaplingo-desktop"
version = "0.1.23"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
path = "lib.rs"

[dependencies]
snaplingo-ui = { path = "../ui" }
snaplingo-render = { path = "../render" }
snaplingo-accessibility = { path = "../accessibility" }
winit = "0.30.12"
softbuffer = "0.4.8"
arboard = "3.2"
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
accesskit = "0.25.2"
accesskit_winit = { version = "0.34.2", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
snaplingo-settings = { path = "../settings" }
snaplingo-core = { path = "../core" }
snaplingo-storage = { path = "../storage" }
tempfile = "3.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSAlert", "NSButton", "NSColor", "NSColorPanel", "NSColorSpace", "NSColorWell", "NSControl", "NSPanel", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }
