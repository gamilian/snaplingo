name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Standard hosted runners are free for public repositories. Do not silently
    # spend a private repository's quota if this repository changes visibility.
    if: github.event.repository.private == false
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, windows-2022]
    env:
      SNAPLINGO_SIGNING_MODE: adhoc
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libgbm-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libleptonica-dev librsvg2-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev tesseract-ocr libtesseract-dev libpipewire-0.3-dev libclang-dev libxdo-dev
      - run: npm ci
      - run: npm test
      - run: npm run ocr:prepare
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Smoke test bundled small OCR
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml bundled_small_smoke -- --ignored --nocapture
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Build and verify desktop release
        run: npm run tauri:build
      - name: Smoke test Linux OCR worker
        if: runner.os == 'Linux'
        run: |
          target/release/snaplingo --ocr-small-worker src-tauri/resources/ocr \
            src-tauri/tests/fixtures/ocr-medium-small.png /tmp/snaplingo-small-ocr-result.json
          node --input-type=module -e "import fs from 'node:fs'; const result = JSON.parse(fs.readFileSync('/tmp/snaplingo-small-ocr-result.json', 'utf8')); if (!result.Ok?.text?.trim() || !result.Ok.lines?.length) throw new Error('Linux small OCR worker returned no text');"
      - name: Smoke test macOS installation
        if: runner.os == 'macOS'
        run: node script/smoke-test-macos.mjs
      - name: Smoke test Windows NSIS installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType nsis
      - name: Smoke test Windows MSI installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType msi
      - name: Smoke test Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType portable
