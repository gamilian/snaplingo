name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Standard hosted runners are free for public repositories. Do not silently
    # spend a private repository's quota if this repository changes visibility.
    if: github.event.repository.private == false
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    env:
      SNAPLINGO_SIGNING_MODE: adhoc
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run ocr:prepare
      - run: cargo fmt --manifest-path apps/desktop/Cargo.toml --check
      - run: cargo test --locked --manifest-path apps/desktop/Cargo.toml
      - name: Smoke test bundled medium OCR
        run: cargo test --locked --manifest-path apps/desktop/Cargo.toml bundled_medium_smoke -- --ignored --nocapture
      - run: cargo check --locked --manifest-path apps/desktop/Cargo.toml --all-targets
      - name: Install native Windows installer compilers
        if: runner.os == 'Windows'
        run: choco install nsis wixtoolset --no-progress -y
      - name: Build native desktop release
        run: npm run native:build
      - name: Verify final native release artifacts
        run: npm run release:verify
      - name: Smoke test macOS installation
        if: runner.os == 'macOS'
        run: node script/smoke-test-macos.mjs
      - name: Smoke test Windows NSIS installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType nsis
      - name: Smoke test Windows MSI installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType msi
      - name: Smoke test Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType portable
