name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libleptonica-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            tesseract-ocr

      - name: Install macOS OCR dependencies
        if: runner.os == 'macOS'
        run: brew install leptonica tesseract

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build and verify desktop release
        run: npm run tauri:build

      - name: Smoke test installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:ProgramFiles\SnapLingo" -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $app) { throw 'Installed SnapLingo executable was not found' }
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) { throw "Installed SnapLingo exited with $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
