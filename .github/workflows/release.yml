name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['codex/release-*']

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Require matching release versions and tag
        run: node script/release-verification.mjs preflight
      - id: matrix
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const include = [
            { os: 'macos-15', label: 'macos-aarch64' },
            { os: 'macos-15-intel', label: 'macos-x86_64' },
            { os: 'windows-2022', label: 'windows-x86_64' },
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${JSON.stringify({ include })}\n`);
          NODE

  build:
    needs: preflight
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: '0'
      SNAPLINGO_SIGNING_MODE: self-signed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run ocr:prepare
      - run: cargo fmt --manifest-path app/Cargo.toml --check
      - run: cargo test --locked --manifest-path app/Cargo.toml --features test-support
      - name: Smoke test bundled medium OCR
        env:
          SNAPLINGO_OCR_SMOKE_ROOT: ${{ github.workspace }}/app/resources/ocr
        run: cargo test --locked -p snaplingo-providers --features local-ocr bundled_medium_smoke -- --ignored --nocapture
      - name: Import persistent macOS certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SNAPLINGO_CERTIFICATE_SHA1: ${{ vars.MACOS_CERTIFICATE_SHA1 }}
        run: node script/import-macos-certificate.mjs
      - name: Install native Windows installer compilers
        if: runner.os == 'Windows'
        run: choco install nsis wixtoolset --no-progress -y
      - name: Build native installers
        run: npm run native:build
      - name: Verify final native release artifacts
        run: npm run release:verify
      - name: Smoke test macOS installation
        if: runner.os == 'macOS'
        run: node script/smoke-test-macos.mjs
      - name: Smoke test Windows NSIS installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType nsis
      - name: Smoke test Windows MSI installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType msi
      - name: Smoke test Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType portable
      - name: Collect verified installers and checksums
        env:
          SNAPLINGO_RELEASE_TARGET: ${{ matrix.label }}
        run: node script/release-verification.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: snaplingo-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Remove imported macOS keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${SNAPLINGO_CODESIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$SNAPLINGO_CODESIGN_KEYCHAIN"
            rm -rf "$SNAPLINGO_SIGNING_DIRECTORY"
          fi
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: snaplingo-*
          path: release-assets
          merge-multiple: true
      - name: Verify downloaded checksums
        working-directory: release-assets
        run: |
          for checksum in *.SHA256SUMS.txt; do sha256sum --check "$checksum"; done
      - name: Create release checksum manifest
        working-directory: release-assets
        run: |
          shopt -s nullglob
          assets=(snaplingo-v*.dmg snaplingo-v*.msi snaplingo-v*-setup.exe snaplingo-v*-portable.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          rm -- *.SHA256SUMS.txt
      - name: Require versioned release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`Unsupported release tag: ${tag}`);
          }
          const notesPath = path.join('docs', 'releases', `${tag}.md`);
          if (!fs.existsSync(notesPath)) {
            throw new Error(`Missing release notes: ${notesPath}`);
          }
          const notes = fs.readFileSync(notesPath, 'utf8');
          if (/维护者发布前填写|删除本节|TODO|TBD/.test(notes)) {
            throw new Error(`Release notes contain authoring placeholders: ${notesPath}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${notesPath}\n`);
          NODE
      - name: Create draft release for final human acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --title "SnapLingo $RELEASE_TAG" --notes-file "${{ steps.notes.outputs.path }}"
