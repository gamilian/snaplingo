name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      windows_offline:
        description: 'Include an additional offline WebView2 Windows installer'
        type: boolean
        default: false
  push:
    tags: ['v*']
    branches: ['codex/release-*']

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Require matching release versions and tag
        run: node script/release-verification.mjs preflight
      - id: matrix
        env:
          OFFLINE: ${{ inputs.windows_offline || false }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const include = [
            { os: 'macos-14', label: 'macos-aarch64', offline: false },
            { os: 'macos-15-intel', label: 'macos-x86_64', offline: false },
            { os: 'windows-2022', label: 'windows-x86_64', offline: false },
          ];
          if (process.env.OFFLINE === 'true') include.push({ os: 'windows-2022', label: 'windows-x86_64-offline', offline: true });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${JSON.stringify({ include })}\n`);
          NODE

  build:
    needs: preflight
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: '0'
      SNAPLINGO_SIGNING_MODE: adhoc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build and verify installers
        if: '!matrix.offline'
        run: npm run tauri:build
      - name: Build and verify offline Windows installers
        if: matrix.offline
        run: npm run tauri:build -- --config src-tauri/tauri.windows-offline.conf.json
      - name: Smoke test macOS installation
        if: runner.os == 'macOS'
        run: node script/smoke-test-macos.mjs
      - name: Smoke test Windows NSIS installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType nsis
      - name: Smoke test Windows MSI installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/smoke-test-windows.ps1 -InstallerType msi
      - name: Collect verified installers and checksums
        env:
          SNAPLINGO_RELEASE_TARGET: ${{ matrix.label }}
        run: node script/release-verification.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: snaplingo-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: snaplingo-*
          path: release-assets
          merge-multiple: true
      - name: Verify downloaded checksums
        working-directory: release-assets
        run: |
          for checksum in *.SHA256SUMS.txt; do sha256sum --check "$checksum"; done
      - name: Create release checksum manifest
        working-directory: release-assets
        run: |
          shopt -s nullglob
          assets=(snaplingo-v*.dmg snaplingo-v*.msi snaplingo-v*-setup.exe snaplingo-v*.AppImage snaplingo-v*.deb)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          rm -- *.SHA256SUMS.txt
      - name: Require versioned release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`Unsupported release tag: ${tag}`);
          }
          const notesPath = path.join('docs', 'releases', `${tag}.md`);
          if (!fs.existsSync(notesPath)) {
            throw new Error(`Missing release notes: ${notesPath}`);
          }
          const notes = fs.readFileSync(notesPath, 'utf8');
          if (/维护者发布前填写|删除本节|TODO|TBD/.test(notes)) {
            throw new Error(`Release notes contain authoring placeholders: ${notesPath}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${notesPath}\n`);
          NODE
      - name: Create draft release for final human acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --title "SnapLingo $RELEASE_TAG" --notes-file "${{ steps.notes.outputs.path }}"
